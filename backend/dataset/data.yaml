# ==============================================================================
# UrbanPulse - YOLOv8 Multi-Class Traffic Perception Dataset Configuration
# Target Domain: Indian & Mixed Urban Intersection Surveillance
# Framework: Ultralytics YOLOv8 (Anchor-free CNN / PANet)
# ==============================================================================

# Directory Root & Split Paths
path: ./dataset           # Dataset root directory
train: images/train       # Training Set (70% — 3,560 images, 12,768 instances)
val: images/val           # Validation Split Set (20% — 1,017 images, 5,086 benchmark instances)
test: images/test         # Unseen Test Set (10% — 509 images, 1,822 instances)

# Number of Discrete Traffic & VRU Classes
nc: 7

# Class Taxonomy & Label Indexing
names:
  0: car
  1: bike
  2: auto-rickshaw
  3: bus
  4: truck
  5: ambulance
  6: pedestrian

